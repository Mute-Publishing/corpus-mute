project:
  type: book
  output-dir: _book

book:
  title: "Mute Magazine Catalogue"
  subtitle: "Generated live from the Mute Corpus Wikibase"
  author: "Mute Publishing"
  date: today
  downloads: [pdf, docx, epub]
  repo-url: https://github.com/Mute-Publishing/corpus-mute/
  repo-subdir: quarto-book
  repo-branch: main
  chapters:
    - index.qmd
    - catalogue.ipynb
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: zephyr
      dark: darkly
  pdf:
    documentclass: scrbook
    papersize: a5
    fontsize: 10pt
    include-in-header:
      text: |
        \usepackage{tgheros}
        \renewcommand{\familydefault}{\sfdefault}
    geometry:
      - inner=10mm
      - outer=10mm
      - top=10mm
      - bottom=10mm
  docx: default
  epub:
    toc: true

number-sections: false

execute:
  enabled: true
  echo: false
  warning: false
