project:
  type: book
  output-dir: _book

book:
  title: "Mute Magazine Catalogue"
  subtitle: "Generated live from the Mute Corpus Wikibase"
  author: "Mute Publishing"
  date: today
  downloads: [pdf, docx, epub]
  repo-url: https://github.com/Mute-Publishing/corpus-mute/
  repo-subdir: quarto-book
  repo-branch: main
  chapters:
    - index.qmd
    - catalogue.ipynb
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: zephyr
      dark: darkly
  pdf:
    documentclass: scrbook
    papersize: a5
    fontsize: 10pt
    geometry:
      - inner=15mm
      - outer=12mm
      - top=15mm
      - bottom=18mm
  docx: default
  epub:
    toc: true

execute:
  enabled: true
  echo: false
  warning: false
