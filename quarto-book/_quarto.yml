project:
  type: book
  output-dir: _book

book:
  title: "Mute Magazine Catalogue"
  subtitle: "Generated live from the Mute Corpus Wikibase"
  author: "Mute Publishing"
  date: today
  downloads: [pdf, docx, epub]
  repo-url: https://github.com/Mute-Publishing/corpus-mute/
  repo-subdir: quarto-book
  repo-branch: main
  chapters:
    - index.qmd
    - catalogue.ipynb
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: zephyr
      dark: darkly
  pdf:
    documentclass: scrbook
    papersize: a5
    fontsize: 10pt
    pdf-engine: xelatex
    filters:
      - bare-urls-as-href.lua
    include-in-header:
      text: |
        \usepackage{fontspec}
        \setmainfont{Inter-Regular.ttf}[
          Path = ../fonts/inter/,
          BoldFont = Inter-Bold.ttf,
          ItalicFont = Inter-Italic.ttf,
          BoldItalicFont = Inter-BoldItalic.ttf]
        \setsansfont{Inter-Regular.ttf}[
          Path = ../fonts/inter/,
          BoldFont = Inter-Bold.ttf,
          ItalicFont = Inter-Italic.ttf,
          BoldItalicFont = Inter-BoldItalic.ttf]
        \usepackage{etoolbox}
        \usepackage{xcolor}
        \usepackage{soul}
        \setul{0.6ex}{0.4pt}
        \setulcolor{black!40}
        \newcommand{\greyul}[1]{\ul{#1}}
        \AtBeginDocument{%
          \hypersetup{hidelinks}%
          \let\origHref\href
          \renewcommand{\href}[2]{\origHref{#1}{\greyul{#2}}}%
        }
        \AtBeginEnvironment{longtable}{\footnotesize\setlength{\tabcolsep}{3pt}\renewcommand{\greyul}[1]{#1}}
    geometry:
      - inner=10mm
      - outer=10mm
      - top=10mm
      - bottom=10mm
  docx: default
  epub:
    toc: true

number-sections: false

execute:
  enabled: true
  echo: false
  warning: false
