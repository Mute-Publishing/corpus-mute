# Custom nginx config for wdqs-frontend with URL shortener proxy.
# Mounted into the container by docker-compose.override.*.yml.
# This is loaded as a separate file in conf.d/ alongside the generated default.conf.
server {
    listen       80;
    server_name  localhost;

    # Proxy endpoint for the URL shortener (TinyURL).
    # The wdqs-frontend JS calls this instead of tinyurl.com directly,
    # avoiding CORS/Content-Security-Policy issues.
    location /shorten {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 10s;
        set $tinyurl_url "http://tinyurl.com/api-create.php?url=$arg_url";
        proxy_pass $tinyurl_url;
        proxy_set_header Host tinyurl.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type text/plain;
    }
}