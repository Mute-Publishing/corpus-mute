# Local overrides for the Mute Wikibase Suite (wikibase-suite/ submodule).
# Adapted from cps-deploy-1 docker-compose.override.local.yml.
#
# A FRESH instance, fully separate from the CPS local stack:
#   - project name  mute-wikibase-local  (CPS uses cps-wikibase-local)
#   - host port     8091                 (CPS uses 8090; old ClimateKG uses 8080/8081/9999)
#   - own volumes   mute-wikibase-local_*
#
# Usage (from c:\git\corpus-mute\wikibase-deploy):
#   Copy-Item .env.example wikibase-suite\.env     # then edit values
#   docker compose -f wikibase-suite/docker-compose.yml -f docker-compose.override.local.yml --project-directory wikibase-suite up -d
#
# Browse: http://localhost:8091/  http://localhost:8091/query/  http://localhost:8091/tools/quickstatements
#
# Never add -v to `down` unless you intend to delete the local data.

name: mute-wikibase-local

services:
  traefik:
    command:
      - "--accesslog.format=common"
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    # !override replaces the base file's 80:80 and 443:443 (no TLS locally).
    ports: !override
      - "127.0.0.1:8091:80"
    volumes:
      - ../config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  wikibase:
    image: wikibase/wikibase:8.3.0
    # Branding: logo from ../images and site name via config/mute-local-settings.php.
    # (paths are relative to wikibase-suite/, the --project-directory)
    volumes:
      - ../../images/Mute_logo_2011-.jpg:/var/www/html/resources/assets/corpus-mute-logo.jpg:ro
      - ../config/mute-local-settings.php:/mute-local-settings.php:ro
      - ../config/main-page.wiki:/var/www/html/main-page.wiki:ro
    environment:
      MW_WG_SERVER: http://${WIKIBASE_PUBLIC_HOST}:8091
      WDQS_PUBLIC_ENDPOINT_URL: http://${WIKIBASE_PUBLIC_HOST}:8091/query/proxy/sparql
      WDQS_PUBLIC_FRONTEND_URL: http://${WIKIBASE_PUBLIC_HOST}:8091/query/
      QUICKSTATEMENTS_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}:8091/tools/quickstatements

  wikibase-jobrunner:
    image: wikibase/wikibase:8.3.0

  # Tell Blazegraph this wiki's concept URI so the endpoint predefines wd:, wdt:, p:, ps:, pq: ... for it.
  # Lets the Query UI examples (and any query) omit the PREFIX lines and work unchanged on local and prod.
  # Must equal WIKIBASE_CONCEPT_URI of wdqs-updater below (the URI the data is stored under).
  wdqs:
    environment:
      WIKIBASE_CONCEPT_URI_PARAM: "-DwikibaseConceptUri=http://${WIKIBASE_PUBLIC_HOST}:8091"

  wdqs-frontend:
    volumes:
      - ../config/wdqs-frontend-entrypoint.sh:/entrypoint.sh:ro
      - ../config/init.mjs:/usr/share/nginx/html/wikibase/init.mjs:ro
      - ../config/embedInit.mjs:/usr/share/nginx/html/wikibase/embedInit.mjs:ro
    environment:
      WDQS_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}:8091/query/proxy/sparql
      WIKIBASE_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}:8091/w/api.php

  wdqs-updater:
    environment:
      WIKIBASE_CONCEPT_URI: http://${WIKIBASE_PUBLIC_HOST}:8091

  quickstatements:
    environment:
      QUICKSTATEMENTS_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}:8091/tools/quickstatements/
      WIKIBASE_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}:8091
